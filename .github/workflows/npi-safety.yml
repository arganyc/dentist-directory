name: NPI safety checks

on:
  push:
    branches: [fix/npi-safe-publishing]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Lint NPI safety files
        run: npx eslint src/lib/dentistos-listings.ts src/lib/dentistos-listings-repository.ts tests/dentistos-listings.test.ts
